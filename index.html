<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMaster Cloud</title>
    <!-- Links para importar fonte estilo pixel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <!-- ------------------------------------------------------------------------------------------------------- -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">
        <form id="meuForm"> <!-- Formulário de cadastro de produtos -->
            <h1>Controle de Estoque</h1>

            <!-- Campos do formulário -->
            <div class="input-group"> 
                <label for="nomeProduto">Nome do Produto</label>
                <input type="text" id="nomeProduto" required>
            </div>

            <div class="grid-produtos">
                <div class="input-group">
                    <label>Quantidade</label>
                    <input type="number" id="quantidade" step="0.1" required>
                </div>
                <div class="input-group">
                    <label>Preço Unitário</label>
                    <input type="number" id="precoUni" step="0.1" required>
                </div>
            </div>
            
            <div class="input-group">
                <label>Categoria</label>
                <input type="text" id="categoria" required>
            </div>
            <!-- ---------------------------------------------------- -->

            <!-- Botões do formulário -->
            <div class="botoes-form">
                <button type="submit" id="btnSalvar">Calcular e Salvar</button>
                <button type="button" onclick="apagarCampos()" class="btn-secundario">Limpar Campos</button>
            </div>

            <!-- Parágrafo onde vai ser mostrado as mensagens de status das operações do banco de dados -->
            <p id="statusMsg">☆*: .｡. o(≧▽≦)o .｡.:*☆</p>
        </form>

        <!-- Section é a lista onde os produtos cadastrados no banco de dados vão aparecer -->
        <section class="lista-container">
            <h2>Produtos em Estoque</h2>
            <div id="listaProdutos"></div>
        </section>
    </div>

</body>

</html>
